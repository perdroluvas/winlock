[project]
name = "winlock"
version = "0.1.0"
description = "Deadlock hero win rates: signal or statistical noise?"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb",
    "matplotlib",
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn>=1.9.1",
    "scipy",
    "seaborn",
    "statsmodels",
]

[project.scripts]
db-reader = "winlock.db_reader:main"
winlock = "winlock.cli:main"

[dependency-groups]
dev = [
    "ipykernel",
    "jupyterlab",
    "nbstripout",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winlock"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
