# Analysis parameters. Code reads from here; no magic numbers in src/.

[data]
# `winlock extract` run of 2026-11-08 16:30 UTC: matches started 10-28..10-31 UTC, deduplicated.
match_player = "data/raw/patch_window/20261108T1630Z/match_player.parquet"
heroes = "data/reference/heroes.csv"

[population]
# Defined BEFORE looking at the rates (see docs/decisions.md).
game_mode = "Normal"
match_mode = ["Unranked", "Ranked"]
match_outcome = "TeamWin"
# A complete match has 12 players: 6 winners and 6 losers. Others are dropped whole.
players_per_match = 12
wins_per_match = 6
# Boolean columns whose flagged rows are removed; a match with any flagged player then fails
# the 12-row check and is dropped whole. Empty: new-player/low-priority/not-scored are kept.
exclude_flags = []

[stats]
alpha = 0.05
ci_method = "wilson"
seed = 42

[figures]
dir = "reports/figures"
tables_dir = "reports/tables"
dpi = 150
# "deadlock" (dark, game colors, art-deco frame) or "clean" (light, one accent).
theme = "deadlock"

[portraits]
# Hero portraits for the win-rate chart, cached once by `winlock portraits` (art: Valve).
api_url = "https://api.deadlock-api.com/v1/assets/heroes"
image_key = "icon_image_small"
dir = "data/reference/portraits"
size_px = 64

[model]
# The last 20% of train (by start_time) chooses the regularization strength C; test is never used for it.
validation_fraction = 0.2
# Retrain check: the first 70% (in time) of the post window refits the model, the rest scores
# both the old (pre-update) and the refit model on the same matches.
post_fit_fraction = 0.7
C_grid = [0.001, 0.01, 0.1, 1.0, 10.0]

[patch]
# "Halloween 2026 + Gameplay Update" (Steam announcement). 35 heroes, ~50 items, mid-boss,
# comeback mechanics; the 6 newest heroes became bannable; Halloween event until 2026-11-02.
title = "Halloween 2026 + Gameplay Update"
published_at = "2026-10-30T20:51:49Z"
# Quality chart of match starts around the update (the dip), and the buffer it motivates.
dip_window = ["2026-10-30T17:00:00Z", "2026-10-31T01:00:00Z"]
dip_bin_minutes = 10
buffer = ["2026-10-30T20:30:00Z", "2026-10-30T21:30:00Z"]

[extract]
# Public data dumps (https://deadlock-api.com/data-dumps). Whole UTC days 10-28..10-31: a
# superset of the analysis windows defined in [windows] below.
manifest_url = "https://data.deadlock-api.com/v1/manifest.json"
table = "match_player"
window_start = "2026-10-28T00:00:00Z"
window_end = "2026-11-01T00:00:00Z"
out_dir = "data/raw/patch_window"
http_retries = 8
# player_slot is only for deduplication; account_id only for the player-clustering check
# (stays in data/raw/, never printed or saved to reports/).
columns = [
    "match_id", "player_slot", "account_id", "hero_id", "team", "won",
    "start_time", "created_at", "game_mode", "match_mode", "match_outcome",
    "game_mode_version", "average_badge", "duration_s",
    "not_scored", "low_pri_pool", "new_player_pool", "banned_hero_ids",
]

[windows]
# Fixed 2026-11-08, BEFORE any post-patch rate was computed (docs/decisions.md). [start, end)
# in UTC, on start_time. Starts 10-30 20:30-21:30 (the update at 20:51:49 and the dip in match
# starts around it) are a buffer that belongs to no window.
train = ["2026-10-28T00:00:00Z", "2026-10-29T20:30:00Z"]        # ML fit (+ C validation)
placebo_pre = ["2026-10-28T20:30:00Z", "2026-10-29T20:30:00Z"]  # placebo's first 24 h
pre = ["2026-10-29T20:30:00Z", "2026-10-30T20:30:00Z"]          # last 24 h of the old game
post = ["2026-10-30T21:30:00Z", "2026-10-31T21:30:00Z"]         # first 24 h of the new game

[comparisons]
# Hero win rates in window `before` vs `after`.
# patch: across the update. placebo: the same comparison 24 h earlier, entirely before the
# update, so every "change" it finds is noise: the baseline for reading the patch result.
patch = { before = "pre", after = "post" }
placebo = { before = "placebo_pre", after = "pre" }
