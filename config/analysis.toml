# Analysis parameters. Code reads from here; no magic numbers in src/.

[data]
# 2026-10-20 residual, created_at window 02:03–22:13 UTC (match_player table).
match_player = "data/raw/20261020T020300Z-20261020T221300Z-50a132fe33c6.parquet"
heroes = "data/reference/heroes.csv"

[population]
# Defined BEFORE looking at the rates (see docs/decisions.md).
game_mode = "Normal"
match_mode = ["Unranked", "Ranked"]
match_outcome = "TeamWin"
# UTC day of start_time; the file also holds late-ingested older matches.
start_day = "2026-10-20"
# A complete match has 12 players: 6 winners and 6 losers. Others are dropped whole.
players_per_match = 12
wins_per_match = 6

[split]
# Temporal: the first 70% of matches by start_time are train, the rest test.
method = "temporal"
train_fraction = 0.7

[stats]
alpha = 0.05
ci_method = "wilson"
seed = 42

[figures]
dir = "reports/figures"
tables_dir = "reports/tables"
dpi = 150
# "deadlock" (dark, game colors, art-deco frame) or "clean" (light, one accent).
theme = "deadlock"

[portraits]
# Hero portraits for the win-rate chart, cached once by `winlock portraits` (art: Valve).
api_url = "https://api.deadlock-api.com/v1/assets/heroes"
image_key = "icon_image_small"
dir = "data/reference/portraits"
size_px = 64

[evaluation]
# Simulated train/test pairs per hero for the "nothing changed" coverage benchmark.
n_sims = 10000

[model]
# The last 20% of train (by start_time) picks the regularization strength; test is used once.
validation_fraction = 0.2
C_grid = [0.001, 0.01, 0.1, 1.0, 10.0]

[synergy]
# Teammate pairs only. No minimum: every pair seen at least once is tested (user's choice), so
# the article can show how many tests one day forces and how few pairs have enough games.
min_pair_matches = 1

[patch]
# "Halloween 2026 + Gameplay Update" (Steam announcement). 35 heroes, ~50 items, mid-boss,
# comeback mechanics; the 6 newest heroes became bannable; Halloween event until 2026-11-02.
title = "Halloween 2026 + Gameplay Update"
published_at = "2026-10-30T20:51:49Z"

[extract]
# Public data dumps (https://deadlock-api.com/data-dumps). Whole UTC days 10-28..10-31: a
# superset of the days around the update.
manifest_url = "https://data.deadlock-api.com/v1/manifest.json"
table = "match_player"
window_start = "2026-10-28T00:00:00Z"
window_end = "2026-11-01T00:00:00Z"
out_dir = "data/raw/patch_window"
http_retries = 8
# player_slot is only for deduplication; account_id only for the player-clustering check
# (stays in data/raw/, never printed or saved to reports/).
columns = [
    "match_id", "player_slot", "account_id", "hero_id", "team", "won",
    "start_time", "created_at", "game_mode", "match_mode", "match_outcome",
    "game_mode_version", "average_badge", "duration_s",
    "not_scored", "low_pri_pool", "new_player_pool", "banned_hero_ids",
]
