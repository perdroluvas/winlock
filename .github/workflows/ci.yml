name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs uv and the Python version pinned in .python-version.
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: make lint
      # The tests build their own fake matches: no data download needed.
      - run: make test
